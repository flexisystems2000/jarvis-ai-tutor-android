name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download offline English speech model
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/model-en-us

          curl -fL --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip

          echo "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498  /tmp/vosk-model.zip" \
            | sha256sum --check

          mkdir -p /tmp/vosk-model
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model

          cp -a \
            /tmp/vosk-model/vosk-model-small-en-us-0.15/. \
            app/src/main/assets/model-en-us/

          cat /proc/sys/kernel/random/uuid \
            > app/src/main/assets/model-en-us/uuid

          test -s app/src/main/assets/model-en-us/am/final.mdl

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Prepare permanent release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p app/keystore

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/keystore/jarvis-release.jks

          test -s app/keystore/jarvis-release.jks

          echo "Release keystore prepared successfully."

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi

          gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-tutor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-tutor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f app/keystore/jarvis-release.jks
